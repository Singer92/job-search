name: Music Job Agent Gemini

on:
  workflow_dispatch:
  schedule:
    # Runs every 3 days at 07:00 AM India time (01:30 UTC)
    - cron: "30 1 */3 * *"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to save jobs.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live job agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python job_agent.py

      - name: Commit updated jobs.json for Dashboard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update job dashboard data"
          file_pattern: jobs.json
